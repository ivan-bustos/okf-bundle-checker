name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Verify offline CI examples
        run: npm run smoke:ci
      - name: Collect synthetic example reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okf-examples-${{ runner.os }}-node-${{ matrix.node }}
          path: reports/ci-examples/
          if-no-files-found: error
          retention-days: 7
      - run: git diff --check
